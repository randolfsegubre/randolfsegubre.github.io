name: Deploy to GitHub Pages

# Runs on every push to main. Tests gate the deploy: a failing test means
# nothing is published (ADR-0005). The MVC app is exported to static files
# because GitHub Pages cannot run a server (ADR-0001, ADR-0007).
#
# Security (ADR-0009): permissions are granted per job, least privilege first,
# and every third-party action is pinned to a full commit hash, because a
# version tag such as v4 can be moved after the fact. The comment after each
# hash names the tag it was resolved from; refresh them together when updating.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job below asks only for what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test Portfolio.slnx --configuration Release
      - name: Export static site
        run: dotnet run --project src/Portfolio.Web --configuration Release --no-launch-profile -- --export "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keep the .nojekyll marker the exporter writes (v4+ skips dotfiles by default).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
